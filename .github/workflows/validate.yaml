name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and run behavior tests
        run: |
          python -m compileall -q custom_components tests
          python - <<'PYTEST'
          import importlib.util
          from pathlib import Path
          count = 0
          for path in sorted(Path("tests").glob("test_*.py")):
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              for name, test in vars(module).items():
                  if name.startswith("test_") and callable(test):
                      test()
                      count += 1
          print(f"{count} Python tests passed")
          PYTEST

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check custom_components/speicher_ladelogik_ae/frontend/speicher-ladelogik-ae-panel.js
      - run: node --test tests/test_ae_panel.mjs

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  dashboard:
    name: Dashboard browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @mdi/js@7.4.47
          npx playwright install --with-deps chromium
      - name: Check dashboard interactions and responsive layouts
        run: node tests/dashboard_browser.cjs
      - name: Keep review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-review
          path: dashboard-review/
          retention-days: 7
