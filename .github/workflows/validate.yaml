name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and run behavior tests
        run: |
          python -m compileall -q custom_components tests
          python - <<'PYTEST'
          import importlib.util
          from pathlib import Path
          count = 0
          for path in sorted(Path("tests").glob("test_*.py")):
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              for name, test in vars(module).items():
                  if name.startswith("test_") and callable(test):
                      test()
                      count += 1
          print(f"{count} Python tests passed")
          PYTEST

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check custom_components/speicher_ladelogik/frontend/speicher-ladelogik-panel.js
      - run: node --test tests/test_frontend_panel.mjs

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
