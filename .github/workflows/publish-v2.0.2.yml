name: Publish v2.0.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.0.2.yml
      - custom_components/speicher_ladelogik_ae/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release version
        run: python -c 'import json; assert json.load(open("custom_components/speicher_ladelogik_ae/manifest.json"))["version"] == "2.0.2"'
      - name: Run behavior tests
        run: |
          python -m compileall -q custom_components tests
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          for path in Path("tests").glob("test_*.py"):
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              for name in vars(module):
                  if name.startswith("test_") and callable(getattr(module, name)):
                      getattr(module, name)()
          PY
      - name: Check frontend
        run: node --test tests/test_ae_panel.mjs
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.2 --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create v2.0.2 \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "v2.0.2 – Speicher-Ladelogik A/E" \
              --notes-file <(sed -n '/^## 2.0.2$/,/^## 2.0.1$/{ /^## 2.0.1$/d; p; }' CHANGELOG.md)
