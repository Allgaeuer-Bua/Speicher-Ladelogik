name: Publish v1.0.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.1.yml

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Publish V1.0.1 release')
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.1 --repo "${{ github.repository }}" --target "0563791cb50852b61ede631b267368440deb7830" --title "V1.0.1" --notes "Energiefluss-Hotfix: Linien bleiben sichtbar, laufende Punkte pausieren bei exakt 0 W. Gilt für PV, Netz und Speicher. Nach der Aktualisierung über HACS Home Assistant neu starten."
