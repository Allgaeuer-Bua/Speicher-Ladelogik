  - sensor:
      - name: Speicher-Ladelogik sicher speicherbar Rest
        default_entity_id: sensor.speicher_ladelogik_sicher_speicherbar_rest
        unique_id: speicher_ladelogik_sicher_speicherbar_rest_v1_beta_1
        device_class: energy
        state_class: measurement
        unit_of_measurement: kWh
        state: "{{ state_attr('sensor.speicher_ladelogik_planung', 'sicher_speicherbar_rest_kwh') | float(0) }}"
      - name: Speicher-Ladelogik Mindestenergie jetzt
        default_entity_id: sensor.speicher_ladelogik_mindestenergie_jetzt
        unique_id: speicher_ladelogik_mindestenergie_jetzt_v1_beta_1
        device_class: energy
        state_class: measurement
        unit_of_measurement: kWh
        state: "{{ state_attr('sensor.speicher_ladelogik_planung', 'mindestenergie_jetzt_kwh') | float(0) }}"
      - name: Speicher-Ladelogik gespeicherte Energie
        default_entity_id: sensor.speicher_ladelogik_gespeicherte_energie
        unique_id: speicher_ladelogik_gespeicherte_energie_v1_beta_1
        device_class: energy
        state_class: measurement
        unit_of_measurement: kWh
        state: "{{ state_attr('sensor.speicher_ladelogik_planung', 'gespeicherte_energie_kwh') | float(0) }}"
      - name: Speicher-Ladelogik Prognoseguete
        default_entity_id: sensor.speicher_ladelogik_prognoseguete
        unique_id: speicher_ladelogik_prognoseguete_v1_beta_1
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ (state_attr('sensor.speicher_ladelogik_planung', 'prognose_effektivfaktor') | float(0) * 100) | round(1) }}"
      - name: Speicher-Ladelogik Soll-Ladeleistung
        default_entity_id: sensor.speicher_ladelogik_soll_ladeleistung
        unique_id: speicher_ladelogik_soll_ladeleistung_v1_beta_1
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        state: "{{ state_attr('sensor.speicher_ladelogik_planung', 'soll_ladeleistung_gesamt_w') | float(0) }}"
      - name: Speicher-Ladelogik Restbedarf AC
        default_entity_id: sensor.speicher_ladelogik_restbedarf_ac
        unique_id: speicher_ladelogik_restbedarf_ac_v1_beta_1
        device_class: energy
        state_class: measurement
        unit_of_measurement: kWh
        state: "{{ state_attr('sensor.speicher_ladelogik_planung', 'restbedarf_ac_kwh') | float(0) }}"
      - name: Venus A Kalibrierungsempfehlung
        default_entity_id: sensor.speicher_ladelogik_kalibrierung_a_empfehlung
        unique_id: speicher_ladelogik_kalibrierung_a_empfehlung_v1_beta_1
        state: >-
          {% if not is_state('input_boolean.speicher_ladelogik_kalibrierung_a_erfolg_bekannt', 'on') %}
            Letzter Erfolg unbekannt
          {% else %}
            {% set tage = (as_timestamp(now()) - as_timestamp(states('input_datetime.speicher_ladelogik_kalibrierung_a_letzter_erfolg'), 0)) / 86400 %}
            {{ 'Faellig' if tage >= 30 else 'In ' ~ (30 - tage) | round(0, 'ceil') | int ~ ' Tagen' }}
          {% endif %}
        attributes:
          tage_seit_erfolg: >-
            {{ ((as_timestamp(now()) - as_timestamp(states('input_datetime.speicher_ladelogik_kalibrierung_a_letzter_erfolg'), 0)) / 86400) | round(1)
               if is_state('input_boolean.speicher_ladelogik_kalibrierung_a_erfolg_bekannt', 'on') else none }}
          intervall_tage: 30
          zellhinweis: >-
            {% if not is_state('input_boolean.speicher_ladelogik_kalibrierung_a_erfolg_bekannt', 'on') or states('input_number.speicher_ladelogik_kalibrierung_a_p1_letzte_drift') | float(-1) < 0 %}
              Keine gueltige protokollierte Ruhe-Messung
            {% elif states('input_number.speicher_ladelogik_kalibrierung_a_p1_letzte_drift') | float(0) >= 50 %}
              Pack 1 nach Ruhephase mindestens 50 mV: Verlauf pruefen
            {% else %}
              Pack 1 bei letzter protokollierter Ruhe-Messung unter 50 mV
            {% endif %}
          pack_2: Bekannte Auffaelligkeit; kein automatischer Kalibrierausloeser
          hinweis: 50 mV ist eine Beobachtungsschwelle, kein Marstek-Grenzwert
      - name: Venus E Kalibrierungsempfehlung
        default_entity_id: sensor.speicher_ladelogik_kalibrierung_e_empfehlung
        unique_id: speicher_ladelogik_kalibrierung_e_empfehlung_v1_beta_1
        state: >-
          {% if not is_state('input_boolean.speicher_ladelogik_kalibrierung_e_erfolg_bekannt', 'on') %}
            Letzter Erfolg unbekannt
          {% else %}
            {% set tage = (as_timestamp(now()) - as_timestamp(states('input_datetime.speicher_ladelogik_kalibrierung_e_letzter_erfolg'), 0)) / 86400 %}
            {{ 'Faellig' if tage >= 30 else 'In ' ~ (30 - tage) | round(0, 'ceil') | int ~ ' Tagen' }}
          {% endif %}
        attributes:
          tage_seit_erfolg: >-
            {{ ((as_timestamp(now()) - as_timestamp(states('input_datetime.speicher_ladelogik_kalibrierung_e_letzter_erfolg'), 0)) / 86400) | round(1)
               if is_state('input_boolean.speicher_ladelogik_kalibrierung_e_erfolg_bekannt', 'on') else none }}
          intervall_tage: 30
          zellhinweis: >-
            {% if not is_state('input_boolean.speicher_ladelogik_kalibrierung_e_erfolg_bekannt', 'on') or states('input_number.speicher_ladelogik_kalibrierung_e_letzte_drift') | float(-1) < 0 %}
              Keine gueltige protokollierte Ruhe-Messung
            {% elif states('input_number.speicher_ladelogik_kalibrierung_e_letzte_drift') | float(0) >= 50 %}
              Nach Ruhephase mindestens 50 mV: Verlauf pruefen
            {% else %}
              Bei letzter protokollierter Ruhe-Messung unter 50 mV
            {% endif %}
          hinweis: 50 mV ist eine Beobachtungsschwelle, kein Marstek-Grenzwert
    binary_sensor:
      - name: Speicher-Ladelogik Planung aktuell
        default_entity_id: binary_sensor.speicher_ladelogik_planung_aktuell
        unique_id: speicher_ladelogik_planung_aktuell_v1_beta_1
        device_class: connectivity
        state: "{{ 0 <= as_timestamp(now()) - state_attr('sensor.speicher_ladelogik_planung', 'berechnet_ts') | float(0) < 120 }}"
