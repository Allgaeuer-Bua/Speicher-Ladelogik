          version: "{{ p.version }}"
          berechnet_ts: "{{ p.berechnet_ts }}"
          betriebsart: "{{ p.betriebsart }}"
          regelung_aktiv: "{{ p.regelung_aktiv }}"
          daten_gueltig: "{{ p.daten_gueltig }}"
          daten_gueltig_gemeinsam: "{{ p.daten_gueltig_gemeinsam }}"
