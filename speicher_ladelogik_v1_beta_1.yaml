      - name: Speicher-Ladelogik Kalibrierung Planung
        default_entity_id: sensor.speicher_ladelogik_kalibrierung_planung
        unique_id: speicher_ladelogik_kalibrierung_planung_v1_beta_1
        icon: mdi:battery-sync
        state: >-
          {% set phasen = {
            'idle': 'Bereit',
            'requested': 'Auftrag vorgemerkt',
            'drain': 'Entladen auf 13 %',
            'wait': 'Wartet auf PV-Fenster',
            'charge': 'Kalibrierladung mit 500 W',
            'rest': 'Ruheprüfung',
              'paused': 'Pausiert – Auftrag bleibt erhalten',
            'restore': 'Grenzwerte wiederherstellen',
            'done': 'Erfolgreich beendet',
            'incomplete': 'Wiederholung vorgemerkt',
            'cancelled': 'Abgebrochen',
            'error': 'Fehler'
          } %}
          {{ phasen.get(c.phase, c.phase) }}
        attributes:
          version: "{{ p.version }}"
          phase_intern: "{{ c.phase }}"
          letzte_pause_grund: "{{ c.letzte_pause_grund }}"
          letzte_pause_ts: "{{ c.letzte_pause_ts }}"
