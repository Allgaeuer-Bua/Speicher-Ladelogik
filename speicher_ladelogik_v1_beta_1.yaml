script:
  speicher_ladelogik_schreiben_geprueft:
    alias: Speicher-Ladelogik Grenzwert schreiben und bestaetigen
    mode: queued
    max: 6
    fields:
      entity:
        description: Freigegebene Lade- oder Entladegrenze
      value:
        description: Zielwert in W
      battery:
        description: A oder E
      restore:
        description: Gesicherte Ausgangswerte wiederherstellen
    sequence:
      - variables:
          result: {ok: false, written: false}
          allowed:
            - number.marstek_venus_a_maximale_ladeleistung
            - number.marstek_venus_e_ladeleistung
            - number.marstek_venus_a_maximale_entladeleistung
            - number.marstek_venus_e_entladeleistung
          battery_entities:
            A:
              - number.marstek_venus_a_maximale_ladeleistung
              - number.marstek_venus_a_maximale_entladeleistung
            E:
              - number.marstek_venus_e_ladeleistung
              - number.marstek_venus_e_entladeleistung
          current: "{{ states(entity) | float(none) }}"
          minimum: "{{ state_attr(entity, 'min') | float(none) }}"
          maximum: "{{ state_attr(entity, 'max') | float(none) }}"
          step: "{{ state_attr(entity, 'step') | float(none) }}"
          control_ok: >-
            {{ (restore | bool(false) or (
              is_state('input_boolean.speicher_ladelogik_aktiv', 'on') and
              is_state('input_select.speicher_ladelogik_betriebsart', 'Automatik'))) and
              is_state('switch.astrameter_venus_' ~ (battery | lower) ~ '_auto_target', 'on') and
              is_state('switch.astrameter_venus_' ~ (battery | lower) ~ '_active', 'on') and
              not is_state('input_boolean.venus_' ~ (battery | lower) ~ '_nicht_laden', 'on') and
              states('input_number.speicher_ladelogik_schreibfehler_' ~ (battery | lower)) | int(0) < 3 }}
      - if:
          - "{{ entity not in allowed or entity not in battery_entities.get(battery, []) or not control_ok or current is none or minimum is none or maximum is none or step is none or step <= 0 }}"
        then:
          - stop: Entitaet oder Steuerfreigabe ungueltig
            response_variable: result
      - if:
          - "{{ value | float(-1) < minimum or value | float(-1) > maximum or (((value | float - minimum) / step) - ((value | float - minimum) / step) | round(0)) | abs > 0.001 }}"
        then:
          - stop: Zielwert ausserhalb der Geraetegrenzen
            response_variable: result
      - if:
          - "{{ (current - value | float) | abs < 25 }}"
        then:
          - variables:
              result: {ok: true, written: false}
          - stop: Wert bereits gesetzt
            response_variable: result
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: "{{ entity }}"
        data:
          value: "{{ value }}"
      - action: homeassistant.update_entity
        continue_on_error: true
        target:
          entity_id: "{{ entity }}"
      - wait_template: >-
          {{ is_number(states(entity)) and (states(entity) | float - value | float) | abs < 25 }}
        timeout: "00:00:20"
        continue_on_timeout: true
      - variables:
          result:
            ok: "{{ wait.completed }}"
            written: true
      - stop: HA-Entitaetswert kontrolliert
        response_variable: result

template:
  - triggers:
      - trigger: event
        event_type: speicher_ladelogik_v1_beta_1_auswertung
    actions:
      - variables:
          p: "{{ trigger.event.data.plan }}"
          c: "{{ trigger.event.data.calibration }}"
    sensor:
      - name: Speicher-Ladelogik Lernspeicher
        default_entity_id: sensor.speicher_ladelogik_lernspeicher
        unique_id: speicher_ladelogik_lernspeicher_v1_beta_1
        icon: mdi:history
        state: "{{ p.version }}"
        attributes:
          active: "{{ trigger.event.data.learning.active }}"
          history: >-
            {{ trigger.event.data.learning.history if not trigger.event.data.journal_event
               or (trigger.event.data.writes_a if c.batterie == 'A' else trigger.event.data.writes_e)
               else (state_attr('sensor.speicher_ladelogik_lernspeicher', 'history') | default([], true)) }}
          models: >-
            {{ trigger.event.data.learning.models if not trigger.event.data.journal_event
               or (trigger.event.data.writes_a if c.batterie == 'A' else trigger.event.data.writes_e)
               else (state_attr('sensor.speicher_ladelogik_lernspeicher', 'models') | default({'A': {}, 'E': {}}, true)) }}
          hinweis: >-
            AC-Ladebedarf gelernt; nutzbare Kapazitaet nur Schaetzung mit angenommenem
            Wirkungsgrad. Bestehende Kapazitaetshelfer werden nicht veraendert.
      - name: Speicher-Ladelogik Planung
        default_entity_id: sensor.speicher_ladelogik_planung
        unique_id: speicher_ladelogik_planung_v1_beta_1
        icon: mdi:solar-power-variant-outline
        state: >-
          {% set status = p.status | string %}
          {% if status.startswith('Kalibrierung ') and ': ' in status %}
            {% set teile = status.split(': ', 1) %}
            {% set phasen = {
              'drain': 'Entladen auf 13 %',
              'wait': 'Wartet auf PV-Fenster',
              'charge': 'Kalibrierladung mit 500 W',
              'rest': 'Ruheprüfung',
              'paused': 'Pausiert – Auftrag bleibt erhalten',
              'restore': 'Grenzwerte wiederherstellen'
            } %}
            {{ teile[0] ~ ': ' ~ phasen.get(teile[1], teile[1]) }}
          {% else %}
            {{ status }}
          {% endif %}
        attributes:
          pv_ac_status: "{{ p.pv_ac_status }}"
          pv_mppt_frisch: "{{ p.pv_mppt_frisch }}"
          pv_mppt_summe_dc_w: "{{ p.pv_mppt_summe_dc_w }}"
          pv_mppt_werte_w: "{{ p.pv_mppt_werte_w }}"
