          e_laden_gesperrt: "{{ c.e_laden_gesperrt }}"
          als_naechstes: "{{ 'Als Nächstes: Venus ' ~ c.naechste_batterie if c.naechste_batterie else 'Kein Folgeauftrag' }}"
          naechster_termin: "{{ c.naechster_termin_ts | timestamp_custom('%d.%m.%Y', true) if c.naechster_termin_ts is not none else '–' }}"
