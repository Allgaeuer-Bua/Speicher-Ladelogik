# Vollständige Referenz der optionalen Venus-Cockpit-Zuordnungen.
# Kernquellen stammen automatisch aus der Integration. Nur nötige Abweichungen
# in die neue Karte übernehmen. Diese Datei ist eine Referenz, kein Pflicht-Setup.
# Optional: statt KARTE.yaml verwenden. Nur abweichende Werte sind nötig.
# Referenzkapazitäten und Vorzeichen-Helfer sind optional und werden nur gelesen.
type: custom:speicher-ladelogik-ae-card
view: overview
theme: light
history_hours: 24
history_refresh_seconds: 120
history_max_points: 720
power_deadband_w: 10
capacity_kwh:
  a: 3.66
  e: 4.56
power_sign:
  a: 1
  e: 1
grid_power_sign: 1
colors:
  a: '#14814f'
  e: '#007e8c'
entities:
