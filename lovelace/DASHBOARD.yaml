# Neues, leeres YAML-Dashboard. Für ein vorhandenes Dashboard: ANSICHTEN.yaml.
title: Speicher
views:
  - title: Übersicht
    path: uebersicht
    type: panel
    cards:
      - type: custom:speicher-ladelogik-ae-card
        view: overview
        theme: light
  - title: Kalibrieren
    path: kalibrieren
    type: panel
    cards:
      - type: custom:speicher-ladelogik-ae-card
        view: calibration
        theme: light
  - title: Steuerung
    path: steuerung
    type: panel
    cards:
      - type: custom:speicher-ladelogik-ae-card
        view: control
        theme: light
  - title: Diagnose
    path: diagnose
    type: panel
    cards:
      - type: custom:speicher-ladelogik-ae-card
        view: diagnostics
        theme: light
