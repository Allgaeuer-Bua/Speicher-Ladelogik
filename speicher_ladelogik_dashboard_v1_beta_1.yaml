              - entity: input_number.speicher_ladelogik_manuell_laden_e_w
                name: Venus E · Laden
              - entity: input_number.speicher_ladelogik_manuell_entladen_e_w
                name: Venus E · Entladen
          - type: markdown
            content: >-
              Die manuellen Werte sind Leistungsgrenzen, kein Force-Modus.
              AstraMeter entscheidet weiterhin anhand des Netzanschlusspunkts.
              Nur der jeweils aktivierte Speicher wird manuell begrenzt; der
              andere bleibt im automatischen Fahrplan.
