              'pv_mppt_frisch') }}


              **Prognosekorrektur:** {{ state_attr(p, 'pv_planungswert_quelle')
              or '–' }}


              **Ladefreigabe:** {{ state_attr(p, 'ueberschuss_quelle') or '–' }}


              **Leistung:** {{ state_attr(p, 'effizienzmodus') or '–' }} ·
              bevorzugt A 1100 / E 1300 W


              **Sollwertstrategie:** {{ state_attr(p, 'sollwertstrategie') or
              '–' }}


              **Warnungen:** {{ (state_attr(p, 'warnungen') or []) | join('; ')
              or 'Keine vorhanden' }}


              **Aktuelle Datenfehler:**

              {% set current = state_attr(p, 'datenfehler_aktuell') or [] %}

              {% if current %}{% for item in current %}• {{ item }}

              {% endfor %}{% else %}Keine vorhanden{% endif %}


              **Letzter Datenfehler:** {{ state_attr(p, 'letzter_datenfehler')
              or '–' }}

              {% set previous = state_attr(p, 'letzte_datenfehler') or [] %}

              {% if previous %}{% for item in previous %}• {{ item }}

              {% endfor %}{% endif %}


              **Vorprüfung A:** {{ (state_attr(c, 'a_pruefhinweise') or []) |
              join('; ') or 'Datenprüfung bestanden' }}


              **Vorprüfung E:** {{ (state_attr(c, 'e_pruefhinweise') or []) |
              join('; ') or 'Datenprüfung bestanden' }}


              **AC-Sensor A:** {{ state_attr(p, 'ac_leistung_venus_a_status') or
              '–' }} · Ladereaktion {{ state_attr(p,
              'ladereaktion_venus_a_status') or '–' }}


              **AC-Sensor E:** {{ state_attr(p, 'ac_leistung_venus_e_status') or
              '–' }} · Ladereaktion {{ state_attr(p,
              'ladereaktion_venus_e_status') or '–' }}


              *Hinweis: „nicht bestätigt" sperrt in V1.0 Beta 1 nicht;
              AstraMeter regelt in dem Fall selbst.*


              {% if state_attr(c, 'letzte_pause_grund') %}**Letzte Pause:** {{
              state_attr(c, 'letzte_pause_zeit') }} · {{ state_attr(c,
              'letzte_pause_grund') }}{% endif %}
