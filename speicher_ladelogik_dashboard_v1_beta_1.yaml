          - type: markdown
            title: Kalibrierjournal und Lernwerte
            content: |2-

                {% set models = state_attr('sensor.speicher_ladelogik_lernspeicher', 'models') or {} %}
                {% set history = state_attr('sensor.speicher_ladelogik_lernspeicher', 'history') or [] %}

                Lernwerte sind **Schätzungen**, keine unabhängige Kapazitätsmessung. Deine Kapazitätshelfer bleiben unverändert.

                | Speicher | Gültige Zyklen | AC-Bedarf | Nutzbar geschätzt |
                | :---: | :---: | :---: | :---: |
                {%- for key in ['A', 'E'] %}
                {%- set m = models.get(key, {}) %}
                | Venus {{ key }} | {{ m.get('count', 0) }} | {{ m.get('ac_kwh', '–') }} kWh | {{ m.get('usable_estimate_kwh', '–') }} kWh |
                {%- endfor %}

                Ab drei gültigen Zyklen kann ein höherer AC-Bedarf das Kalibrierfenster verlängern. Annahme: konfigurierter Ladewirkungsgrad; keine automatische Änderung des SoC-Ziels.

                {% if history -%}
                | Ende | Speicher | Ergebnis | AC |
                | :---: | :---: | :--- | :---: |
                {%- for r in history[-8:] | reverse %}
                | {{ r.end | timestamp_custom('%d.%m. %H:%M', true) }} | {{ r.battery }} | {{ r.reason }} | {{ r.ac_kwh }} kWh |
                {%- endfor %}
                {%- else %}
                Noch kein protokollierter Versuch mit V1.0 Beta 1.
                {%- endif %}

                Details einschließlich Dauer und Drift vorher/nachher: **Speicher-Ladelogik Lernspeicher** öffnen. Historie: letzte 20 Ereignisse.
