              {% set p = 'sensor.speicher_ladelogik_planung' %}

              {% set c = 'sensor.speicher_ladelogik_kalibrierung_planung' %}

              **{{ states(p) }}** · Version {{ state_attr(p, 'version') }}


              {{ state_attr(p, 'entscheidungsgrund') or 'Kein Entscheidungsgrund
              vorhanden.' }}


              **Normaler Fahrplan:** {{ state_attr(p,
              'normaler_fahrplan_status') or '–' }}


              **PV AC:** {{ state_attr(p, 'pv_ac_status') or '–' }}


              **MPPT DC:** {{ state_attr(p, 'pv_mppt_summe_dc_w') if
              state_attr(p, 'pv_mppt_summe_dc_w') is not none else 'nicht
